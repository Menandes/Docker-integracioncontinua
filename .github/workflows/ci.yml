name: CI - Pruebas automáticas

on: # Eventos que disparan el flujo
  push: # En cada push a cualquier rama
  pull_request: # Al abrir o actualizar un Pull Request

jobs:
  pruebas: # Único trabajo del flujo
    runs-on: ubuntu-latest # Máquina virtual Linux proporcionada por GitHub

    services: # Contenedores auxiliares para el job
      redis: # La aplicación necesita Redis
        image: redis:7 # Imagen oficial de Redis 7
        ports:
          - 6379:6379 # Expone el puerto para la conexión de la aplicación
        options: >- # Espera a que Redis esté listo antes de continuar
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código # 1) Clona el repositorio en la máquina virtual
        uses: actions/checkout@v4

      - name: Instalar Python # 2) Instala Python 3.11 (igual que en el Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias # 3) Instala Flask, Redis y pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requerimientos.txt pytest

      - name: Ejecutar pruebas # 4) Ejecuta las pruebas y decide si el flujo pasa o falla
        env:
          REDIS_HOST: localhost # Indica que Redis está disponible en localhost
        working-directory: app # Carpeta de trabajo: app/ (donde está app.py)
        run: pytest -v # Si una prueba falla, el job se marca en rojo

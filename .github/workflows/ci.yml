name: CI - Pruebas automáticas

on:
  push:            
  pull_request:    

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requerimientos.txt pytest

      - name: Ejecutar pruebas
        env:
          REDIS_HOST: localhost
        working-directory: app
        run: pytest -v

    desplegar: # Trabajo 2: publica la página
      needs: pruebas # Solo se ejecuta si el trabajo "pruebas" terminó bien
      if: github.ref == 'refs/heads/main' # Y solo en la rama main (no en Pull Requests)
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Descargar el código
          uses: actions/checkout@v4
        - name: Configurar Pages
          uses: actions/configure-pages@v5
        - name: Empaquetar la página como artefacto
          uses: actions/upload-pages-artifact@v4
          with:
            path: ./public
        - name: Desplegar a GitHub Pages
          id: deployment
        uses: actions/deploy-pages@v4        
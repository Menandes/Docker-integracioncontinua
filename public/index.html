<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto CI/CD - Integración Continua</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .tarjeta {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 460px;
      text-align: center;
    }
    h1 { margin-top: 0; }
    .ok {
      display: inline-block;
      background: #238636;
      color: #fff;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .animacion {
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }    
    code { background: #30363d; padding: 0.1rem 0.4rem; border-radius: 4px; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <span class="ok">✓ Desplegado automáticamente</span>
    <h1>Proyecto de Integración Continua</h1>
    <p>Esta página se publicó en <strong>GitHub Pages</strong> mediante un flujo de CI/CD.</p>
    <p>El despliegue solo se ejecuta cuando las pruebas con <code>pytest</code> pasan correctamente.</p>
    <img class="animacion" src="mi-gif.gif" alt="Animación personalizada">
  </div>
</body>
</html>
